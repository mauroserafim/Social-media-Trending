name: AI Trends Research Agent

on:
  schedule:
    - cron: "0 0,12 * * *"  # 08:00 BRT (12 UTC) e 20:00 BRT (00 UTC)
  workflow_dispatch:
    inputs:
      max_ideas:
        description: "Maximum number of trend ideas to generate"
        required: false
        default: "10"

permissions:
  contents: write

jobs:
  run-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Create required directories
        run: mkdir -p logs data outputs/json outputs/markdown

      - name: Run AI Trends Agent
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-4o-mini' }}
          MAX_IDEAS: ${{ github.event.inputs.max_ideas || '10' }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          SMTP_HOST: ${{ secrets.SMTP_HOST || 'smtp.gmail.com' }}
          SMTP_PORT: ${{ secrets.SMTP_PORT || '587' }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_FROM: ${{ secrets.SMTP_USER }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python main.py --run --max-ideas ${{ github.event.inputs.max_ideas || '10' }}

      - name: Upload JSON results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trends-json-${{ github.run_id }}
          path: outputs/json/
          retention-days: 30

      - name: Upload Markdown report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trends-markdown-${{ github.run_id }}
          path: outputs/markdown/
          retention-days: 30

      - name: Upload logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agent-logs-${{ github.run_id }}
          path: logs/
          retention-days: 7

      - name: Commit outputs to repository
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add outputs/
          git diff --staged --quiet || git commit -m "chore: trends update [run ${{ github.run_id }}]"
          git push
