name: Daily Carousel Content Agent

on:
  schedule:
    - cron: "0 13 * * *"  # 10:00 AM BRT (13 UTC) — 1x por dia, 1h após o Trends Agent
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  run-carousel:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Create required directories
        run: mkdir -p logs data outputs/carousel/images

      - name: Generate today's carousel
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.6-flash' }}
          PEXELS_API_KEY: ${{ secrets.PEXELS }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: python main.py --carousel

      - name: Upload carousel package
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: carousel-${{ github.run_id }}
          path: outputs/carousel/
          retention-days: 30

      - name: Upload logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: carousel-agent-logs-${{ github.run_id }}
          path: logs/
          retention-days: 7

      - name: Commit outputs to repository
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add outputs/carousel/
          git diff --staged --quiet || git commit -m "chore: carousel content [run ${{ github.run_id }}]"
          git push
